name: Update prices

on:
  schedule:
    # daily at 05:17 UTC
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild data
        run: node scripts/build-data.mjs

      - name: Commit if changed
        run: |
          git config user.name "tradeup-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/items.json data/deals.json
          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "chore(data): refresh prices"
            git push
          fi
